services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - backend_data:/app/data   # SQLite file persists across container restarts
    environment:
      - PORT=4000
      - DB_PATH=/app/data/store.db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - backend

volumes:
  backend_data:
